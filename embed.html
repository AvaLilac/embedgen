<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Server Embed</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Google+Sans+Display:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --p-container:#4f378b;
  --p-on-container:#eaddff;
  --p-main:#d0bcff;
  --p-on-main:#381e72;
  --s-container:#4a4458;
  --s-on-container:#e8def8;
  --bg:#141218;
  --bg2:#1d1b20;
  --bg3:#211f26;
  --bg4:#2b2930;
  --onsurface:#e6e1e5;
  --onsurfacevar:#cac4d0;
  --outline:#938f99;
  --outlinevar:#49454f;
  --radius-full:100px;
  --radius-lg:16px;
  --radius-md:12px;
}

html,body{
  min-height:100%;
  font-family:'Google Sans',system-ui,sans-serif;
  background:transparent;
  color:var(--onsurface);
  font-size:14px;
}

.wrap{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:8px;
}

.embed{
  background:var(--bg2);
  border:1px solid var(--outlinevar);
  border-radius:var(--radius-lg);
  overflow:hidden;
  width:100%;
  max-width:340px;
  display:flex;
  flex-direction:column;
}

.embed-banner{
  width:100%;aspect-ratio:16/5;
  object-fit:cover;display:block;
}
.embed-banner-placeholder{
  width:100%;aspect-ratio:16/5;
  background:var(--p-container);
  display:flex;align-items:center;justify-content:center;
  opacity:0.6;
}
.embed-banner-placeholder .material-symbols-outlined{
  font-size:28px;color:var(--p-on-container);opacity:0.5;
}

.embed-header{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px 0;
}

.embed-icon{
  width:44px;height:44px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  border:2px solid var(--bg2);
}
.embed-icon-ph{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:var(--p-container);
  border:2px solid var(--bg2);
}
.embed-icon-ph .material-symbols-outlined{font-size:20px;color:var(--p-on-container);}

.embed-name{
  font-size:15px;font-weight:600;
  color:var(--onsurface);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.embed-members{
  font-size:11px;color:var(--onsurfacevar);
  display:flex;align-items:center;gap:3px;margin-top:2px;
}
.embed-members .material-symbols-outlined{font-size:12px;}

.embed-body{
  padding:10px 16px 16px;
  display:flex;flex-direction:column;gap:10px;
}

.online-row{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--onsurfacevar);
}
.online-dot{
  width:8px;height:8px;border-radius:50%;
  background:#3db887;flex-shrink:0;
}

.embed-desc{
  font-size:13px;color:var(--onsurfacevar);line-height:1.55;
}

.embed-join{
  height:40px;
  border-radius:var(--radius-full);
  border:none;
  background:var(--p-main);
  color:var(--p-on-main);
  font-family:'Google Sans',sans-serif;
  font-size:14px;font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;
  width:100%;
  transition:filter 0.15s;
}
.embed-join:hover{filter:brightness(1.12);}
.embed-join .material-symbols-outlined{font-size:16px;}

.embed-powered{
  font-size:10px;padding:0 16px 10px;
  text-align:right;color:var(--onsurfacevar);opacity:0.4;
}

.loading-wrap{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;padding:40px 16px;
}
.loading-wrap p{font-size:13px;color:var(--onsurfacevar);}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="embed" id="embed">
    <div class="loading-wrap">
      <span class="material-symbols-outlined spin" style="font-size:28px;color:var(--onsurfacevar);">progress_activity</span>
      <p>Loading…</p>
    </div>
  </div>
</div>

<script>
const API_BASE="https://api.stoat.chat";
const CDN_BASE="https://cdn.stoatusercontent.com";

function parseHash(){
  const raw=location.hash.replace(/^#/,"");
  const p={};
  const re=/([a-zA-Z_]+)"([^"]*)"/g;
  let m;
  while((m=re.exec(raw))!==null) p[m[1]]=decodeURIComponent(m[2].replace(/\+/g," "));
  return p;
}

function isStoat(url){
  try{return new URL(url).hostname==="stt.gg";}catch(_){return false;}
}

function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,
      g=parseInt(hex.slice(3,5),16)/255,
      b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}else{
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){
      case r:h=((g-b)/d+(g<b?6:0))/6;break;
      case g:h=((b-r)/d+2)/6;break;
      case b:h=((r-g)/d+4)/6;break;
    }
  }
  return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}

function applyTheme(hex){
  if(!hex||!/^#[0-9a-fA-F]{6}$/.test(hex))return;
  const[h,s]=hexToHsl(hex);
  const hs=`${h},${Math.min(s+10,100)}%`;
  const ss=`${h},${Math.max(s-15,5)}%`;
  const r=document.documentElement;

  r.style.setProperty("--p-main",`hsl(${hs},80%)`);
  r.style.setProperty("--p-on-main",`hsl(${h},40%,15%)`);
  r.style.setProperty("--p-container",`hsl(${hs},28%)`);
  r.style.setProperty("--p-on-container",`hsl(${hs},90%)`);
  r.style.setProperty("--s-container",`hsl(${ss},26%)`);
  r.style.setProperty("--s-on-container",`hsl(${ss},88%)`);

  r.style.setProperty("--bg",`hsl(${h},12%,7%)`);
  r.style.setProperty("--bg2",`hsl(${h},11%,11%)`);
  r.style.setProperty("--bg3",`hsl(${h},10%,14%)`);
  r.style.setProperty("--bg4",`hsl(${h},9%,17%)`);
  r.style.setProperty("--outlinevar",`hsl(${h},9%,27%)`);
  r.style.setProperty("--outline",`hsl(${h},7%,57%)`);
  r.style.setProperty("--onsurfacevar",`hsl(${h},11%,76%)`);
  r.style.setProperty("--onsurface",`hsl(${h},14%,90%)`);
}

async function fetchStoat(code){
  const res=await fetch(`${API_BASE}/invites/${code}`);
  if(!res.ok)return null;
  const d=await res.json();
  const bid=d.server_banner?._id||null;
  const iid=d.server_icon?._id||null;
  return{
    name:d.server_name||null,
    memberCount:d.member_count||null,
    onlineCount:d.online_count||null,
    bannerUrl:bid?`${CDN_BASE}/banners/${bid}?width=640`:null,
    iconUrl:iid?`${CDN_BASE}/icons/${iid}?width=128`:null,
  };
}

function esc(s){
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderEmbed(params,stoat){
  const name=stoat?.name||params.servername||params.name||"Server";
  const desc=params.desc||params.serverdescription||"";
  const link=params.serverlink||params.invite||"#";

  const bannerHtml=stoat?.bannerUrl
    ?`<img class="embed-banner" src="${esc(stoat.bannerUrl)}" alt="" loading="lazy"/>`
    :stoat!==null
      ?`<div class="embed-banner-placeholder"><span class="material-symbols-outlined">explore</span></div>`
      :"";

  const iconHtml=stoat?.iconUrl
    ?`<img class="embed-icon" src="${esc(stoat.iconUrl)}" alt="" loading="lazy"/>`
    :`<div class="embed-icon-ph"><span class="material-symbols-outlined">dns</span></div>`;

  const membersHtml=stoat?.memberCount
    ?`<div class="embed-members">
        <span class="material-symbols-outlined">group</span>
        ${Number(stoat.memberCount).toLocaleString()} members
      </div>`
    :"";

  const onlineHtml=stoat?.onlineCount
    ?`<div class="online-row"><div class="online-dot"></div>${Number(stoat.onlineCount).toLocaleString()} online</div>`
    :"";

  const descHtml=desc
    ?`<div class="embed-desc">${esc(desc)}</div>`
    :"";

  document.getElementById("embed").innerHTML=`
    ${bannerHtml}
    <div class="embed-header">
      ${iconHtml}
      <div style="flex:1;min-width:0;">
        <div class="embed-name">${esc(name)}</div>
        ${membersHtml}
      </div>
    </div>
    <div class="embed-body">
      ${onlineHtml}
      ${descHtml}
      <a class="embed-join" href="${esc(link)}" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">login</span>
        Join Server
      </a>
    </div>
    <div class="embed-powered">avalilac.codeberg.page/embedgen</div>
  `;
}

async function init(){
  const params=parseHash();
  const rawColor=params.color||"";
  const hex=rawColor?("#"+rawColor.replace(/^#/,"")):"";
  if(hex)applyTheme(hex);

  const link=params.serverlink||params.invite||"";
  if(link&&isStoat(link)){
    const code=link.replace(/.*\//,"");
    try{
      const stoat=await fetchStoat(code);
      renderEmbed(params,stoat);
    }catch(_){
      renderEmbed(params,null);
    }
  }else{
    renderEmbed(params,null);
  }
}

init();
</script>
</body>
</html>
